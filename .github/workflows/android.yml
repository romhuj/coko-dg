name: coko DG Android checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'backend/**'
      - 'frontend/**'
      - 'config/waveforms.yaml'
      - 'packaging/prepare_android.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'backend/**'
      - 'frontend/**'
      - 'config/waveforms.yaml'
      - 'packaging/prepare_android.py'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build && node --test tests/*.test.cjs tests/*.test.mjs
      - name: Stage mobile assets
        run: python packaging/prepare_android.py
      - name: Backend regression tests
        run: |
          python -m pip install -r android/requirements-android.txt
          python -m unittest backend.tests.test_chat_modes backend.tests.test_context_roles backend.tests.test_role_features backend.tests.test_pairing backend.tests.test_mobile_runtime backend.tests.test_chat_requests backend.tests.test_role_management backend.tests.test_turn_reliability backend.tests.test_receipt_edges backend.tests.test_deepseek_empty backend.tests.test_chat_archive backend.tests.test_mobile_conversations backend.tests.test_execution_receipts -q
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build debug and instrumentation APKs
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: coko-dg-debug-ci
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14
